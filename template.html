<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2339c6e8'/%3E%3Ccircle cx='44' cy='20' r='9' fill='%23ffe08a'/%3E%3Cpath d='M0 40q8-6 16 0t16 0 16 0 16 0V64H0z' fill='%23136d9a'/%3E%3Cpath d='M6 41h36l16-12H24l-5 4H6z' fill='%23e0332b'/%3E%3Cpath d='M8 37h33l9-6' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3Cpath d='M19 33l3-6h12l1 6z' fill='%23222'/%3E%3Cpath d='M38 29l4-9h5' stroke='%23222' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M0 48q8-6 16 0t16 0 16 0 16 0V64H0z' fill='%2304425f'/%3E%3C/svg%3E">
<title>Эгейский берег — гидроцикл и сокровища</title>
<style>
  html, body { margin: 0; height: 100%; background: #04121a; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: #eef6f8;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* a phone held upright gets the whole page turned on its side, so the game is always landscape */
  @media (orientation: portrait) and (pointer: coarse) {
    body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
  }
  #game { position: fixed; inset: 0; cursor: crosshair; transition: filter 1s; }
  #game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cu { visibility: hidden; }
  body[data-mode="under"] #hud { display: none; }
  body[data-mode="under"] #cu { visibility: visible; }
  body[data-mode="under"] #cs { visibility: hidden; }
  #hud { position: fixed; left: 12px; top: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; opacity: .75;
         text-shadow: 0 1px 2px #000a; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 16px; border-radius: 10px;
          background: #04121a99; backdrop-filter: blur(6px); white-space: nowrap; pointer-events: none; }
  #hint b { font-size: 20px; }
  #msg { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-size: 20px; font-weight: 700;
         text-shadow: 0 2px 8px #000c; transition: opacity .3s; pointer-events: none; text-align: center; }
  #count { position: fixed; right: 18px; top: 14px; padding: 6px 14px; border-radius: 20px; font-size: 22px; font-weight: 800;
           color: #ffe08a; background: #04121aa0; backdrop-filter: blur(6px); text-shadow: 0 0 10px #ffb300aa; pointer-events: none; }
  #count.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); color: #fff; } 100% { transform: scale(1); } }
  #skimark { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 2; }
  #skimark .b { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #skimark .t { padding: 3px 9px; border-radius: 12px; font: 700 15px system-ui, sans-serif; color: #fff;
                background: #e0332bd0; box-shadow: 0 0 10px #0006; white-space: nowrap; }
  #skimark .t::before { content: attr(data-pre); font-weight: 500; }
  #skimark .a { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent;
                border-left: 20px solid #ff5a4d; filter: drop-shadow(0 0 3px #000a); }
  body[data-mode="under"] #skimark { display: none; }
  /* language switch, top right under the treasure count; above the loading screen */
  #lang { position: fixed; right: 18px; top: 62px; z-index: 6; display: flex; padding: 3px; border-radius: 16px;
          background: #04121aa0; backdrop-filter: blur(6px); }
  #lang button { border: 0; padding: 4px 10px; border-radius: 13px; font: 700 13px system-ui, sans-serif; color: #eef6f8cc;
                 background: none; cursor: pointer; touch-action: manipulation; }
  #lang button.on { background: #ffe08a; color: #3a2400; }
  body[data-mode="under"] #lang { display: none; }
  #fade { position: fixed; inset: 0; background: radial-gradient(#bfefff, #2a8db0); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #fade.on { opacity: 1; }
  #panel { position: fixed; right: 12px; top: 10px; width: 300px; padding: 10px 12px; border-radius: 8px;
           background: #0b0f14c8; backdrop-filter: blur(6px); font: 12px/1.3 system-ui, sans-serif; }
  #panel.hidden { display: none; }
  #panel label { display: grid; grid-template-columns: 1fr 110px 40px; gap: 6px; align-items: center; margin: 3px 0; }
  #panel input { width: 110px; }
  #panel output { text-align: right; opacity: .8; }
  #err { position: fixed; inset: 0; display: none; padding: 40px; color: #f88; font: 16px system-ui; white-space: pre-wrap; background: #000; }
  /* underwater renderer's own elements (loading bar reused, stats line) */
  #i { position: fixed; top: 30px; left: 12px; margin: 0; font: 12px/1.6 ui-monospace, monospace; pointer-events: none; }
  /* loading screen in the middle; the game shows through a blur that clears as loading goes on */
  #load { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 10px; text-align: center; pointer-events: none; transition: opacity 1s;
          background: radial-gradient(ellipse at center, #04121a55 0%, #04121a00 70%); }
  #load .ttl { font: 800 clamp(30px, 6vw, 64px)/1 system-ui, sans-serif; letter-spacing: .02em; color: #fff;
               text-shadow: 0 2px 24px #0009, 0 0 40px #39c6e877; }
  #load .sub { font-size: clamp(14px, 1.6vw, 20px); color: #ffe08a; text-shadow: 0 1px 8px #000b; margin-bottom: 14px; }
  #p { width: min(420px, 70vw); height: 10px; border-radius: 6px; background: #0007; overflow: hidden; box-shadow: 0 0 0 1px #ffffff22; }
  #b { display: block; height: 100%; background: linear-gradient(90deg, #14a9c4, #9ff6ff, #ffe08a); transform: scaleX(0); transform-origin: 0; }
  #load .row { display: flex; gap: 12px; align-items: baseline; font-size: 15px; text-shadow: 0 1px 6px #000c; }
  #pc { font-weight: 800; color: #9ff6ff; min-width: 3em; }
  #load .go { display: none; margin-top: 10px; padding: 8px 18px; border-radius: 20px; background: #ffe08a; color: #3a2400;
              font-weight: 800; animation: pulse 1.4s ease-in-out infinite; }
  #load.can .go { display: block; }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 24px #ffe08a88; } }
  /* after you start playing early, the underwater loading shrinks into a small bar at the top */
  #load.mini { inset: 12px auto auto 50%; transform: translateX(-50%); width: 260px; gap: 3px; background: none; font-size: 12px; }
  #load.mini .ttl, #load.mini .sub, #load.mini .go, #load.mini #pc { display: none; }
  #load.mini #p { width: 100%; height: 4px; }
  #load.mini .row { font-size: 12px; opacity: .85; }
  #load.done { opacity: 0; }
  /* touch controls: a floating stick on the left, look by dragging on the right, two buttons */
  #touch { display: none; position: fixed; inset: 0; z-index: 3; }
  body.touch #touch { display: block; }
  body[data-mode="under"] #touch { display: none; }
  #look { position: absolute; left: 42%; right: 0; top: 0; bottom: 0; }
  #stickzone { position: absolute; left: 0; width: 42%; top: 25%; bottom: 0; }
  #joy { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; left: calc(110px + env(safe-area-inset-left)); top: calc(100% - 115px);
         background: radial-gradient(#ffffff10, #ffffff22); box-shadow: inset 0 0 0 2px #ffffff55; pointer-events: none; opacity: .55; }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
          background: #ffffffcc; box-shadow: 0 2px 10px #0006; }
  .tb { position: absolute; border: 0; border-radius: 50%; font: 800 14px system-ui, sans-serif; color: #fff;
        background: #04121a88; box-shadow: inset 0 0 0 2px #ffffff77; backdrop-filter: blur(4px); touch-action: none; }
  .tb.on { background: #ffffff55; }
  #bA { right: calc(24px + env(safe-area-inset-right)); bottom: 28px; width: 96px; height: 96px; background: #e0332bbb; font-size: 15px; }
  #bB { right: calc(136px + env(safe-area-inset-right)); bottom: 22px; width: 70px; height: 70px; }
  #bC { right: calc(40px + env(safe-area-inset-right)); bottom: 140px; width: 64px; height: 64px; }
  #bA:empty, #bB:empty, #bC:empty { display: none; }
  body.touch #hud { display: none; }
  body.touch #hint { bottom: 8px; font-size: 12px; padding: 5px 12px; max-width: 46vw; white-space: normal; text-align: center; }
  body.touch #hint b { font-size: 14px; }
  body.touch #count { font-size: 18px; top: 8px; right: 10px; }
  body.touch #msg { font-size: 17px; top: 18%; }
  body.touch #lang { top: 50px; right: 10px; }
</style>
</head>
<body data-mode="surface">
<div id="game"><canvas id="cs"></canvas><canvas id="cu"></canvas></div>
<div id="hud"><div id="fps">запуск…</div><div class="help" data-i18n>клик — захват мыши · H — настройки моря · L — язык</div></div>
<div id="load"><div class="ttl" data-i18n>Эгейский берег</div><div class="sub" data-i18n>гидроцикл и сокровища ⭐</div>
  <div id="p"><i id="b"></i></div><div class="row"><span id="pc">0%</span><span id="s" data-i18n>Загрузка…</span></div><span id="w" hidden></span>
  <div class="go" data-i18n>Остров готов — нажми любую клавишу или коснись экрана</div></div>
<div id="touch"><div id="stickzone"></div><div id="look"></div><div id="joy"><div id="knob"></div></div>
  <button class="tb" id="bA"></button><button class="tb" id="bB"></button><button class="tb" id="bC"></button></div>
<div id="hint"></div>
<div id="msg"></div>
<div id="skimark" style="display:none"><div class="b"><span class="t" data-i18n="Гидроцикл · " data-i18n-attr="data-pre"></span><i class="a"></i></div></div>
<div id="count">⭐ 0 / 0</div>
<pre id="i"></pre>
<div id="fade"></div>
<div id="panel" class="hidden"></div>
<div id="lang"></div>
<div id="err"></div>
<!--I18N-->
<script>
// Loading screen. The island takes the first 40% of the bar, the underwater world the rest. Once the island renders
// it shows through a blur that clears as the rest loads; a key or a tap starts the game early.
(() => {
  const $ = (id) => document.getElementById(id);
  const part = { surf: 0, uw: 0 };
  let shown = 0, state = 'load', said = ''; // load -> mini (playing early) -> done
  window.onLang(() => { if (said) $('s').textContent = window.tr(said); });
  const blur = (t) => { if (state === 'load') $('game').style.filter = `blur(${(26 * Math.min(1, (1 - t) / 0.6)).toFixed(1)}px)`; };
  blur(0);
  window.loadProgress = (k, v, msg, ms = 600) => {
    part[k] = Math.max(part[k], v);
    const t = part.surf * 0.4 + part.uw * 0.6;
    if (msg) $('s').textContent = window.tr(said = msg);
    $('pc').textContent = Math.round(t * 100) + '%';
    const a = $('b').animate({ transform: [`scaleX(${shown})`, `scaleX(${t})`] }, { duration: ms, fill: 'forwards', easing: 'cubic-bezier(.3,.5,.5,1)' });
    shown = t;
    blur(t);
    if (part.surf >= 1) $('load').classList.add('can');
    if (t >= 0.999) { state = 'done'; $('game').style.filter = ''; $('load').classList.add('done'); }
    return a;
  };
  window.loadSkip = () => {
    if (state !== 'load' || part.surf < 1) return;
    state = 'mini'; $('game').style.filter = ''; $('load').classList.add('mini');
  };
})();
</script>
<!--SURFACE-->
<!--UNDERWATER-->
</body>
</html>
